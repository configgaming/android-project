name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kodu İndir
      uses: actions/checkout@v4

    - name: Java Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Buildozer Bağımlılıklarını Kur
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lldb

    - name: Buildozer ve Cython Kur
      run: |
        pip3 install --upgrade pip
        pip3 install --user --upgrade cython buildozer

    - name: Buildozer ile APK Derle
      run: |
        echo y | buildozer init
        
        # Gerekli ayarları spec dosyasına kesin olarak işliyoruz
        sed -i 's/#requirements = python3/requirements = python3,requests,urllib3,idna,certifi,charset-normalizer/' buildozer.spec
        sed -i 's/#android.permissions =/android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,RECEIVE_BOOT_COMPLETED/' buildozer.spec
        sed -i 's/#services =/services = tgservice:service.py/' buildozer.spec
        
        # Lisans otomatik onay satırındaki yorum işaretini kaldırıp True yapıyoruz
        sed -i 's/#\(android.accept_sdk_license =\)/\1/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        
        ~/.local/bin/buildozer -v android debug

    - name: APK Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
